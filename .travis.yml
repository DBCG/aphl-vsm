language: python
dist: jammy
python:
  - "3.8"
services:
  - docker

cache:
  directories:
    - $HOME/.cache/yarn
    - node_modules
    - .next/cache

install:
  - cd $TRAVIS_BUILD_DIR
  - ./bin/install_ci_dependencies.sh

jobs:
  include:
    - stage: test
      script: 
      - cd $TRAVIS_BUILD_DIR/vsm-app
      - npm ci && npm run test-ci
      install: skip
    - stage: deploy
      if: branch IN (main)
      script:
        - cd $TRAVIS_BUILD_DIR/vsm-app
        - git remote set-url origin https://$GITHUB_TOKEN@github.com/DBCG/aphl-vsm.git
        - npm version patch
        - git add .
        - git commit -m "update version number [ci skip]"
        - git push origin main
        - docker build -t vsm-app:$TRAVIS_COMMIT .
        - cd ../
        - ./bin/deploy.sh
