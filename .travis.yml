language: python
python:
  - "3.8"
services:
  - docker
cache:
  directories:
    - $HOME/.cache/yarn
    - node_modules
    - .next/cache

before_install:
  - cd ./vsm-app
  - docker build -t vsm-app:$TRAVIS_COMMIT .

install:
  - cd $TRAVIS_BUILD_DIR
  - ./bin/install_ci_dependencies.sh

jobs:
  include:
    - stage: test
      script: npm ci && npm run test-ci
      install: skip
    - stage: deploy
      if: branch IN (main, deployed)
      script:
        - cd $TRAVIS_BUILD_DIR
        - ./bin/deploy.sh
