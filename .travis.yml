language: python
python:
  - "3.8"
cache:
  directories:
    - $HOME/.cache/yarn
    - node_modules
    - .next/cache

before_install:
  - sudo systemctl stop docker.service && sudo systemctl stop docker.socket
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
  - yes | sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
  - sudo apt-get update
  - sudo apt-get -y -o Dpkg::Options::="--force-confnew" install docker-ce
  - docker version

install:
  - cd $TRAVIS_BUILD_DIR
  - ./bin/install_ci_dependencies.sh

jobs:
  include:
    - stage: test
      script: 
      - cd $TRAVIS_BUILD_DIR/vsm-app
      - npm ci && npm run test-ci
      install: skip
    - stage: deploy
      if: branch IN (main, deployed)
      script:
        - cd $TRAVIS_BUILD_DIR/vsm-app
        - git remote set-url origin https://$GITHUB_TOKEN@github.com/DBCG/aphl-vsm.git
        - npm version patch
        - git add .
        - git commit -m "update version number [ci skip]"
        - git push origin HEAD:$TRAVIS_BRANCH
        - docker build -t vsm-app:$TRAVIS_COMMIT .
        - cd ../
        - ./bin/deploy.sh
