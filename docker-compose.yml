volumes:
  cqf_db_data:
    driver: local
  postgres_data:
    driver: local
services:

  redis:
    image: redis:latest
    ports:
    - 6379:6379
  hapi-fhir-jpa-server-starter:
    image: hapiproject/hapi:v8.6.0-1
    environment:
    - redis.host=redis
    - redis.port=6379
    - redis.database=4
    - spring.datasource.url=jdbc:postgresql://cqf-db:5432/cqfruler
    - spring.datasource.driverClassName=org.postgresql.Driver
    - spring.datasource.username=myuser
    - spring.datasource.password=secret
    - spring.datasource.hikari.maximum-pool-size=30
    - spring.jpa.properties.hibernate.dialect=ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
    - hapi.fhir.server_address=http://localhost:8082/fhir
    - hapi.fhir.cql.cql_logging_enabled=true
    - hapi.fhir.fhir_version=R4
    - hapi.fhir.allow_multiple_delete=true
    - hapi.fhir.reuse_cached_search_results_millis=-1
    - hapi.fhir.casereporting.enabled=true
    - hapi.fhir.logger.format=
        Path[$${servletPath}] Source[$${requestHeader.x-forwarded-for}]
        Trace[$${requestHeader.x-b3-traceid}]
        Operation[$${operationType} $${operationName} $${idOrResourceName}]
        UA[$${requestHeader.user-agent}] Params[$${requestParameters}]
        ResponseEncoding[$${responseEncodingNoDefault}]
    - hapi.fhir.cr.enabled=true
    - hapi.fhir.cdshooks.enabled=true
    - hapi.fhir.cdshooks.clientIdHeaderName=client_id
    - spring.main.allow-circular-references=true
    - spring.main.allow-bean-definition-overriding=true
    ports:
      - 8082:8080
    depends_on:
      - cqf-db
  cqf-db:
    image: postgres:18.1-alpine
    volumes:
      - cqf_db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: cqfruler
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
  postgres:
    image: postgres:18.1-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.2
    command: 'start'
    ports:
      - 8080:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
    depends_on:
      - postgres
  # Widens user_attribute.value from VARCHAR(255) to TEXT so that encrypted
  # basic-auth credentials are not truncated (Keycloak 21 hard limit).
  # Polls until Keycloak has created the table, then runs the ALTER. Safe to
  # re-run: postgres treats TYPE TEXT → TYPE TEXT as a no-op.
  keycloak-db-patch:
    image: postgres:18.1-alpine
    depends_on:
      - keycloak
    environment:
      PGPASSWORD: password
    entrypoint:
      - /bin/sh
      - -c
      - |
        until psql -h postgres -U keycloak -d keycloak -tc \
          "SELECT 1 FROM information_schema.tables WHERE table_name='user_attribute'" \
          2>/dev/null | grep -q 1; do
          sleep 2
        done
        psql -h postgres -U keycloak -d keycloak \
          -c "ALTER TABLE user_attribute ALTER COLUMN value TYPE TEXT;"
    restart: "no"
