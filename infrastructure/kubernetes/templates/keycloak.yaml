apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: vsm
spec:
  type: LoadBalancer
  selector:
    app: keycloak
  ports:
  - name: http 
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
  namespace: vsm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - image: quay.io/keycloak/keycloak:legacy
        imagePullPolicy: Always
        name: keycloak
        env:
        - name: KEYCLOAK_USER
          value: admin
        - name: KEYCLOAK_PASSWORD
          value: 9n*j0FY*oRpJiW#5
        ports:
          - containerPort: 8080
            protocol: TCP

